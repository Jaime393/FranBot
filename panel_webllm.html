<!-- Panel para descarga/estado WebLLM (insertar en index.html antes de </body>) -->
<div id="webllm-panel" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#1a1f2b; color:#eee; padding:20px; border-radius:12px; z-index:2000; text-align:center; min-width:250px; box-shadow:0 0 20px #000;">
  <strong>🧠 WebLLM</strong>
  <p id="webllm-status" style="margin:10px 0;">Cargando modelo...</p>
  <progress id="webllm-progress" value="0" max="100" style="width:100%;"></progress><br>
  <button id="webllm-cancelar" style="background:#a22; color:white; border:none; padding:5px 15px; margin-top:10px; border-radius:4px;">Cancelar</button>
</div>
