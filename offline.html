<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FranBot sin conexión</title>
  <style>
    body { font-family: 'Segoe UI', system-ui, sans-serif; text-align: center; padding: 2rem; background: #0a0f1a; color: #e0e0e0; }
    h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    p { margin-bottom: 1.5rem; color: #aaa; }
    button { background: #4fc3f7; color: #0b0e14; border: none; padding: 12px 28px; border-radius: 24px; font-size: 1rem; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <h1>🔒 Sin conexión</h1>
  <p>Parece que todavía no se han descargado los recursos necesarios para funcionar offline.</p>
  <p>Vuelve a abrir FranBot cuando tengas internet por primera vez. El Service Worker cacheará todo automáticamente.</p>
  <button onclick="location.reload()">Reintentar</button>
</body>
</html>
