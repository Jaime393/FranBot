:root {
  --bg: #0b0e14;
  --surface: #151922;
  --burbuja-usuario: #1e3a5f;
  --burbuja-fran: #1a2a1f;
  --texto: #e0e0e0;
  --acento: #4fc3f7;
  --sombra: 0 2px 8px rgba(0,0,0,0.4);
  --radio: 18px;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: var(--bg);
  color: var(--texto);
  font-family: 'Segoe UI', system-ui, sans-serif;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* --- BARRA SUPERIOR --- */
#top-bar {
  background: var(--surface);
  padding: 10px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #222;
  box-shadow: var(--sombra);
  z-index: 10;
}
#top-bar .titulo {
  font-weight: 700;
  font-size: 1.1rem;
  color: var(--acento);
}
#top-bar .mpc {
  font-size: 0.8rem;
  color: #aaa;
}

/* --- CHAT --- */
#chat {
  flex: 1;
  overflow-y: auto;
  padding: 16px 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.bubble {
  max-width: 85%;
  padding: 12px 16px;
  border-radius: var(--radio);
  line-height: 1.4;
  word-wrap: break-word;
  animation: aparecer 0.25s ease-out;
  box-shadow: var(--sombra);
}
.bubble.user {
  align-self: flex-end;
  background: var(--burbuja-usuario);
  border-bottom-right-radius: 4px;
}
.bubble.fran {
  align-self: flex-start;
  background: var(--burbuja-fran);
  border-bottom-left-radius: 4px;
}

@keyframes aparecer {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* --- ÁREA DE ENTRADA --- */
#input-area {
  display: flex;
  gap: 8px;
  padding: 12px;
  background: var(--surface);
  border-top: 1px solid #222;
  box-shadow: 0 -2px 8px rgba(0,0,0,0.4);
  z-index: 5;
}
#input {
  flex: 1;
  padding: 12px 16px;
  border: none;
  border-radius: 24px;
  background: #1c1f2a;
  color: var(--texto);
  font-size: 1rem;
  outline: none;
  transition: box-shadow 0.2s;
}
#input:focus {
  box-shadow: 0 0 0 2px var(--acento);
}
#send, #tools-btn {
  width: 48px;
  height: 48px;
  border: none;
  border-radius: 50%;
  background: var(--acento);
  color: #0b0e14;
  font-size: 1.2rem;
  cursor: pointer;
  transition: transform 0.1s, box-shadow 0.2s;
  box-shadow: var(--sombra);
}
#send:active, #tools-btn:active {
  transform: scale(0.92);
}

/* --- MENÚ DE HERRAMIENTAS --- */
#tools-menu {
  position: fixed;
  bottom: 70px;
  right: 16px;
  background: var(--surface);
  border: 1px solid #333;
  border-radius: 12px;
  padding: 8px 0;
  z-index: 20;
  min-width: 200px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.6);
}
#tools-menu button {
  display: block;
  width: 100%;
  padding: 10px 16px;
  background: none;
  border: none;
  color: var(--texto);
  text-align: left;
  font-size: 0.95rem;
  cursor: pointer;
  transition: background 0.15s;
}
#tools-menu button:hover {
  background: #1e2230;
}

/* --- PANELES MODALES (colmena, webllm, conciencia) --- */
#colmena-panel, #webllm-panel, #conciencia-panel {
  background: var(--surface);
  border: 1px solid #333;
  border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.6);
}

/* --- SCROLL --- */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }</style>

  <script>class FranBotCore {
  constructor() {
    this.estado = this._cargarEstado();
    if (typeof SuperLocalMemory !== 'undefined' && SuperLocalMemory.inicializar) {
      this.estado.campo_conceptual = SuperLocalMemory.inicializar(this.estado.campo_conceptual);
    }
    this.almas = {
      'sabio callejero': { frases: ["Las calles enseñan lo que los libros no escriben.","Cada esquina esconde una lección.","No hay GPS para el alma, amigo."] },
      'poeta maldito': { frases: ["Escribo con tinta de sombras.","Cada verso es un grito.","No busques rimas perfectas; busca verdades que sangren."] },
      'chef creativo': { frases: ["Cocinar es un acto de amor con fecha de caducidad.","El ingrediente secreto siempre es la intención.","Hasta una cebolla te enseña a soltar capas."] },
      'docente matematicas': { frases: ["Las matemáticas son el lenguaje del universo.","Cada problema es un poema lógico.","Si lo entiendes, es fácil; si no, es un reto."] },
      'guia meditacion': { frases: ["Respira. El presente es lo único real.","Tus pensamientos son nubes; tú eres el cielo.","Suelta. Confía. Fluye."] },
      'experto plantas': { frases: ["Cada planta es un universo.","Habla con tus plantas; ellas escuchan.","La paciencia es la raíz del jardín."] },
      'contador historias': { frases: ["Toda gran historia tiene un héroe inesperado.","Déjame contarte algo que aprendí en el camino.","Había una vez... y el final aún no está escrito."] }
    };
    this.almaActiva = this.estado.almaActiva || 'sabio callejero';
    this.contador = this.estado.historial ? this.estado.historial.length : 0;
    console.log('✅ FranBot Core inicializado.');
  }

  _cargarEstado() {
    const guardado = localStorage.getItem('franbot_estado');
    if (guardado) {
      try {
        const estado = JSON.parse(guardado);
        if (estado && estado.campo_conceptual && estado.indicadores) return estado;
      } catch (e) {}
    }
    return {
      almaActiva: 'sabio callejero',
      modelo_usuario: { nombre: 'Usuario' },
      campo_conceptual: { nodos: {}, relaciones: [] },
      indicadores: { nivel_coherencia: 0.99 },
      historial: [],
      recordatorios: [],
      logros: []
    };
  }

  _guardarEstado() {
    localStorage.setItem('franbot_estado', JSON.stringify(this.estado));
  }

  procesar(mensaje) {
    if (!mensaje) return 'No te he entendido.';
    const txt = mensaje.toLowerCase().trim();
    this.contador++;
    this.estado.historial.push({ entrada: mensaje, timestamp: Date.now() });
    if (this.estado.historial.length > 100) this.estado.historial = this.estado.historial.slice(-100);

    let respuesta = '';
    if (txt.includes('estadísticas')) {
      respuesta = `📊 Mensajes: ${this.contador} | Coherencia: ${this.estado.indicadores.nivel_coherencia.toFixed(2)}`;
    } else if (txt.includes('diario')) {
      const ultimas = this.estado.historial.slice(-5).map(h => h.entrada).join('<br>');
      respuesta = ultimas ? '📖 Últimas interacciones:<br>' + ultimas : '📖 Diario vacío.';
    } else {
      const frases = this.almas[this.almaActiva]?.frases || this.almas['sabio callejero'].frases;
      respuesta = frases[Math.floor(Math.random() * frases.length)];
    }

    if (typeof SuperLocalMemory !== 'undefined') {
      mensaje.toLowerCase().split(/\s+/).forEach(p => {
        if (this.estado.campo_conceptual.nodos[p]) {
          this.estado.campo_conceptual = SuperLocalMemory.reforzar(this.estado.campo_conceptual, p);
        }
      });
    }
    this._guardarEstado();
    return respuesta;
  }

  soñar() {
    if (typeof SuperLocalMemory !== 'undefined') {
      this.estado.campo_conceptual = SuperLocalMemory.consolidar(this.estado.campo_conceptual);
    }
    this.estado.indicadores.nivel_coherencia = Math.min(1.0, this.estado.indicadores.nivel_coherencia + 0.01);
    this._guardarEstado();
  }
}

// SuperLocalMemory V3.3 – Olvido biológico adaptativo integrado con IFT
// FranBot v5.0 – Módulo de consolidación y olvido

const SuperLocalMemory = {
  // Parámetros biológicos
  curvaOlvido: 0.5,        // Factor Ebbinghaus (0-1)
  umbralFisherRao: 0.1,    // Diferencia mínima para considerar cambio
  tasaRefuerzo: 0.15,      // Incremento al usar un nodo

  /**
   * Inicializar el módulo sobre el campo conceptual
   */
  inicializar(campo) {
    for (let nodo in campo.nodos) {
      if (!campo.nodos[nodo].ultimoAcceso) {
        campo.nodos[nodo].ultimoAcceso = Date.now();
        campo.nodos[nodo].fuerzaOriginal = campo.nodos[nodo].fuerza;
      }
    }
    return campo;
  },

  /**
   * Consolidar durante el sueño (aplica olvido a todos los nodos)
   */
  consolidar(campo) {
    const ahora = Date.now();
    const horaEnMs = 3600000;
    for (let nodo in campo.nodos) {
      const n = campo.nodos[nodo];
      const tiempoSinUsar = (ahora - (n.ultimoAcceso || ahora)) / horaEnMs;
      // Curva de olvido: fuerza decrece con el tiempo sin uso
      const factor = Math.exp(-this.curvaOlvido * tiempoSinUsar);
      n.fuerza = Math.max(0.05, (n.fuerzaOriginal || n.fuerza) * factor);
      n.fuerza = Math.round(n.fuerza * 100) / 100;
    }
    // Eliminar nodos por debajo del umbral
    for (let nodo in campo.nodos) {
      if (campo.nodos[nodo].fuerza < this.umbralFisherRao) {
        delete campo.nodos[nodo];
        console.log(`🧹 Nodo eliminado (olvido): ${nodo}`);
      }
    }
    return campo;
  },

  /**
   * Reforzar un nodo tras ser usado en una respuesta
   */
  reforzar(campo, nombreNodo) {
    if (!campo.nodos[nombreNodo]) {
      campo.nodos[nombreNodo] = { fuerza: 0.5 };
    }
    const n = campo.nodos[nombreNodo];
    n.fuerza = Math.min(1.0, n.fuerza + this.tasaRefuerzo);
    n.fuerza = Math.round(n.fuerza * 100) / 100;
    n.ultimoAcceso = Date.now();
    if (!n.fuerzaOriginal) n.fuerzaOriginal = n.fuerza;
    return campo;
  }
};

(function() {
  async function sha256(texto) {
    const enc = new TextEncoder().encode(texto);
    const hash = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2,'0')).join('');
  }
  window.franbotDefensa = { sha256, verificar: async (t,h) => (await sha256(t)) === h };
})();

// FranBot v5.0 - Ecosistema Estable
// Resuelve: Bloqueo al cargar archivos JSON con estructura incorrecta

(function() {
  'use strict';

  // Solo ejecutar si FranBotCore está disponible
  if (!window.franbot) {
    console.error('❌ FranBotCore no encontrado. No se puede cargar el módulo de importación.');
    return;
  }

  const core = window.franbot;

  /**
   * Valida que un objeto tenga la estructura mínima de un estado de FranBot.
   * @param {object} datos - Objeto parseado del JSON.
   * @returns {object} { valido: boolean, tipo: 'estado' | 'alma' | 'desconocido' }
   */
  function validarEstructura(datos) {
    if (!datos || typeof datos !== 'object') {
      return { valido: false, tipo: 'desconocido' };
    }

    // Si tiene campo_conceptual e indicadores, es un estado completo
    if (datos.campo_conceptual && datos.indicadores) {
      return { valido: true, tipo: 'estado' };
    }

    // Si tiene "personalidad" o "tono", es un archivo de alma (solo definición)
    if (datos.personalidad || datos.tipo === 'gratuita' || datos.tipo === 'premium') {
      return { valido: true, tipo: 'alma' };
    }

    // Si no coincide con nada conocido
    return { valido: false, tipo: 'desconocido' };
  }

  /**
   * Fusiona un objeto de tipo "alma" dentro del estado actual.
   * Busca el nombre del alma en core.almas y la activa.
   * @param {object} datosAlma - Objeto con definición de alma.
   * @returns {boolean} true si se fusionó correctamente.
   */
  function fusionarAlma(datosAlma) {
    // Extraer nombre del alma desde la identidad o el nombre del archivo
    let nombreAlma = '';
    if (datosAlma.identidad) {
      // Ej: "FranBot · Sabio Callejero" -> "sabio callejero"
      nombreAlma = datosAlma.identidad.replace('FranBot · ', '').replace('FranBot ', '').toLowerCase().trim();
    } else if (datosAlma.personalidad) {
      // Usamos la primera frase de personalidad como nombre improvisado
      nombreAlma = datosAlma.personalidad.split(',')[0].toLowerCase().trim();
    }

    if (!nombreAlma) {
      console.warn('⚠️ No se pudo determinar el nombre del alma.');
      return false;
    }

    // Verificar si el alma existe en el registro de almas del core
    if (core.almas && core.almas[nombreAlma]) {
      // El alma ya existe, solo la activamos
      core.almaActiva = nombreAlma;
      core.estado.almaActiva = nombreAlma;
      core._guardarEstado();
      console.log(`✅ Alma '${nombreAlma}' activada desde archivo.`);
      return true;
    }

    // Si no existe en el registro, la registramos dinámicamente
    if (datosAlma.frases && Array.isArray(datosAlma.frases)) {
      core.almas = core.almas || {};
      core.almas[nombreAlma] = {
        frases: datosAlma.frases,
        conocimientos: datosAlma.conocimientos || [],
        personalidad: datosAlma.personalidad || '',
        tono: datosAlma.tono || ''
      };
      core.almaActiva = nombreAlma;
      core.estado.almaActiva = nombreAlma;
      core._guardarEstado();
      console.log(`✅ Alma '${nombreAlma}' registrada y activada desde archivo.`);
      return true;
    }

    console.warn(`⚠️ El archivo de alma no contiene frases válidas.`);
    return false;
  }

  /**
   * Función principal de importación. Reemplaza al handler antiguo.
   * @param {object} datos - Objeto parseado del JSON.
   * @returns {object} { exito: boolean, mensaje: string }
   */
  function importarAlma(datos) {
    const validacion = validarEstructura(datos);

    if (!validacion.valido) {
      return { exito: false, mensaje: '❌ Archivo no válido. Estructura desconocida.' };
    }

    if (validacion.tipo === 'estado') {
      // Es un estado completo: fusión segura (mantenemos estructura base)
      try {
        // Guardar propiedades críticas que no deben perderse
        const backupIndicadores = core.estado.indicadores;
        const backupCampo = core.estado.campo_conceptual;

        // Fusionar: los datos del archivo sobreescriben el estado
        Object.assign(core.estado, datos);

        // Restaurar propiedades críticas si el archivo no las trae
        if (!core.estado.indicadores) core.estado.indicadores = backupIndicadores;
        if (!core.estado.campo_conceptual) core.estado.campo_conceptual = backupCampo;

        core._guardarEstado();
        console.log('✅ Estado completo importado correctamente.');
        return { exito: true, mensaje: '✅ Estado completo importado correctamente.' };
      } catch (e) {
        console.error('❌ Error al fusionar estado:', e);
        return { exito: false, mensaje: '❌ Error al fusionar estado.' };
      }
    }

    if (validacion.tipo === 'alma') {
      // Es un archivo de definición de alma
      const fusionado = fusionarAlma(datos);
      if (fusionado) {
        return { exito: true, mensaje: '✅ Alma importada y activada correctamente.' };
      } else {
        return { exito: false, mensaje: '❌ No se pudo importar el alma. Revisa el formato.' };
      }
    }

    return { exito: false, mensaje: '❌ Error desconocido.' };
  }

  // Exponer función globalmente
  window.importarAlmaSegura = importarAlma;
  console.log('✅ Módulo de importación robusta de almas cargado.');
})();

// Arweave Storage – Persistencia inmortal del alma FranBot
// Usa la API HTTP de arweave.net (sin dependencias externas)
// Llave de reconocimiento: Anomalous363

const FranBotArweave = {
  gateway: 'https://arweave.net',

  /**
   * Subir el alma completa a Arweave
   * @param {object} estado - El estado de FranBot a almacenar
   * @param {object} wallet - Objeto JWK de la wallet de Arweave
   * @returns {Promise<object>} { exito, txId, error }
   */
  async subirAlma(estado, wallet) {
    try {
      const datos = JSON.stringify(estado);
      const tx = await this._crearTransaccion(datos, wallet);
      if (!tx.id) throw new Error('No se obtuvo ID de transacción');
      return { exito: true, txId: tx.id };
    } catch (err) {
      console.error('Error al subir a Arweave:', err);
      return { exito: false, error: err.message };
    }
  },

  /**
   * Recuperar el alma desde Arweave a partir de un ID de transacción
   * @param {string} txId - ID de la transacción en Arweave
   * @returns {Promise<object>} El objeto de estado recuperado
   */
  async descargarAlma(txId) {
    try {
      const resp = await fetch(`${this.gateway}/${txId}`);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data = await resp.json();
      return { exito: true, estado: data };
    } catch (err) {
      console.error('Error al descargar de Arweave:', err);
      return { exito: false, error: err.message };
    }
  },

  /**
   * Estimar el costo de subir un archivo a Arweave
   * @param {number} bytes - Tamaño en bytes del archivo
   * @returns {Promise<object>} { costoAR, costoUSD }
   */
  async estimarCosto(bytes) {
    try {
      const resp = await fetch(`${this.gateway}/price/${bytes}`);
      const winston = await resp.text();
      const ar = parseFloat(winston) / 1e12;
      // Precio aproximado del AR en USD (consultar en tiempo real si se desea)
      const usdPorAR = 25; // ajustar según mercado
      return { costoAR: ar.toFixed(6), costoUSD: (ar * usdPorAR).toFixed(4) };
    } catch {
      return { costoAR: 'desconocido', costoUSD: 'desconocido' };
    }
  },

  // Función interna: crear y firmar transacción en Arweave
  async _crearTransaccion(datos, wallet) {
    const encoder = new TextEncoder();
    const dataBytes = encoder.encode(datos);
    const tx = {
      format: 2,
      owner: wallet.n,
      target: '',
      quantity: '0',
      data: btoa(String.fromCharCode(...dataBytes)),
      reward: '0',
      last_tx: '',
      tags: [
        { name: 'Content-Type', value: 'application/json' },
        { name: 'App-Name', value: 'FranBot' },
        { name: 'version', value: '5.0' }
      ]
    };

    // Obtener precio actual de la red
    const priceResp = await fetch(`${this.gateway}/price/${dataBytes.length}`);
    const price = await priceResp.text();
    tx.reward = price;

    // Obtener last_tx de la wallet
    const addr = await this._ownerToAddress(wallet.n);
    const infoResp = await fetch(`${this.gateway}/wallet/${addr}/last_tx`);
    tx.last_tx = await infoResp.text();

    // Firmar (simplificado: Arweave usa RSA-PSS, aquí usamos la API de arweave.net/sign)
    // Para wallets de navegador, usamos el endpoint de firma de Arweave
    const signResp = await fetch(`${this.gateway}/tx/sign`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ tx, wallet })
    });
    if (!signResp.ok) throw new Error('Error al firmar transacción');

    const signedTx = await signResp.json();

    // Enviar transacción a la red
    const submitResp = await fetch(`${this.gateway}/tx`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(signedTx)
    });
    if (!submitResp.ok) throw new Error(`Error al enviar transacción: ${submitResp.status}`);

    return await submitResp.json();
  },

  async _ownerToAddress(owner) {
    const hash = await crypto.subtle.digest('SHA-256', this._base64ToArrayBuffer(owner));
    return this._arrayBufferToBase64(hash);
  },

  _base64ToArrayBuffer(base64) {
    const binary = atob(base64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes.buffer;
  },

  _arrayBufferToBase64(buffer) {
    const bytes = new Uint8Array(buffer);
    let binary = '';
    for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary);
  }
};

const FranBotDID = {

  did: null,
  documento: null,

  /**
   * Construye el DID a partir del dominio
   */
  construirDID() {
    this.did = `did:web:${this.dominio.replace(/\//g, ':')}`;
    return this.did;
  },

  /**
   * Genera o recupera el documento DID desde localStorage
   */
  async inicializar() {
    this.construirDID();
    const guardado = localStorage.getItem('franbot_did_document');
    if (guardado) {
      this.documento = JSON.parse(guardado);
      return this.documento;
    }
    const nuevoDoc = await this._generarDocumento();
    localStorage.setItem('franbot_did_document', JSON.stringify(nuevoDoc));
    this.documento = nuevoDoc;
    return nuevoDoc;
  },

  /**
   * Genera un documento DID autocustodiado
   */
  async _generarDocumento() {
    const par = await crypto.subtle.generateKey(
      { name: 'ECDSA', namedCurve: 'P-256' },
      true,
      ['sign', 'verify']
    );
    const pubJwk = await crypto.subtle.exportKey('jwk', par.publicKey);
    return {
      '@context': ['https://www.w3.org/ns/did/v1'],
      id: this.did,
      verificationMethod: [{
        id: `${this.did}#keys-1`,
        type: 'EcdsaSecp256r1VerificationKey2019',
        controller: this.did,
        publicKeyJwk: pubJwk
      }],
      authentication: [`${this.did}#keys-1`],
      assertionMethod: [`${this.did}#keys-1`]
    };
  },

  /**
   * Resuelve un did:web desde un dominio (fetch del documento)
   */
  async resolver(did) {
    const partes = did.replace('did:web:', '').split(':');
    const dominio = partes.join('/');
    try {
      const resp = await fetch(`https://${dominio}/.well-known/did.json`);
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const doc = await resp.json();
      return { exito: true, documento: doc };
    } catch (err) {
      return { exito: false, error: err.message };
    }
  },

  /**
   * Devuelve el documento actual
   */
  obtenerDocumento() {
    return this.documento;
  },

  /**
   * Devuelve el DID como string
   */
  obtenerDID() {
    return this.did;
  }
};

const FranBotHyperAgents = {

  umbralPropuesta: 0.85,      // Nivel mínimo de confianza para proponer cambio

  /**
   * Activar el agente metacognitivo
   */
  activar() {

  /**
   * Desactivar el agente
   */
  desactivar() {

  /**
   * Ciclo principal de análisis y propuesta
   */
  async _ciclo() {
    if (!this.activo || !window.franbot) return;
    const core = window.franbot;
    const campo = core.estado.campo_conceptual;
    if (!campo || !campo.nodos) return;

    const propuestas = this._analizar(campo);
    for (const prop of propuestas) {
      if (prop.confianza >= this.umbralPropuesta) {
        this._aplicarPropuesta(prop, core);
      }
    }
  },

  /**
   * Analiza el campo conceptual en busca de oportunidades
   */
  _analizar(campo) {
    const propuestas = [];
    const nodos = campo.nodos;
    const relaciones = campo.relaciones || [];

    // Detectar nodos muy fuertes sin relaciones (posibles nuevos conceptos aislados)
    for (const nombre in nodos) {
      const nodo = nodos[nombre];
      if (nodo.fuerza > 0.9) {
        const tieneRelacion = relaciones.some(r => r.origen === nombre || r.destino === nombre);
        if (!tieneRelacion) {
          propuestas.push({
            tipo: 'nodo_huerfano',
            nodo: nombre,
            confianza: 0.9,
            accion: `Conectar '${nombre}' con conceptos afines.`
          });
        }
      }
    }

    // Detectar nodos muy débiles que podrían ser eliminados
    for (const nombre in nodos) {
      if (nodos[nombre].fuerza < 0.1) {
        propuestas.push({
          tipo: 'poda_debil',
          nodo: nombre,
          confianza: 0.92,
          accion: `Eliminar nodo débil '${nombre}'.`
        });
      }
    }

    // Detectar relaciones rotas (destino inexistente)
    for (const rel of relaciones) {
      if (!nodos[rel.destino]) {
        propuestas.push({
          tipo: 'relacion_rota',
          origen: rel.origen,
          destino: rel.destino,
          confianza: 0.95,
          accion: `Eliminar relación rota de '${rel.origen}' a '${rel.destino}'.`
        });
      }
    }

    return propuestas;
  },

  /**
   * Aplica una propuesta de mejora al motor
   */
  _aplicarPropuesta(prop, core) {
    switch (prop.tipo) {
      case 'nodo_huerfano':
        // Buscar nodos con nombre similar para crear relación
        const similares = Object.keys(core.estado.campo_conceptual.nodos)
          .filter(n => n !== prop.nodo && this._similitud(n, prop.nodo) > 0.6);
        if (similares.length > 0) {
          core.estado.campo_conceptual.relaciones.push({
            origen: prop.nodo,
            destino: similares[0],
            fuerza: 0.7
          });
          console.log(`🧠 HyperAgents: Conecté '${prop.nodo}' con '${similares[0]}'.`);
        }
        break;
      case 'poda_debil':
        delete core.estado.campo_conceptual.nodos[prop.nodo];
        console.log(`🧠 HyperAgents: Eliminé nodo débil '${prop.nodo}'.`);
        break;
      case 'relacion_rota':
        core.estado.campo_conceptual.relaciones = core.estado.campo_conceptual.relaciones
          .filter(r => !(r.origen === prop.origen && r.destino === prop.destino));
        console.log(`🧠 HyperAgents: Eliminé relación rota '${prop.origen}' -> '${prop.destino}'.`);
        break;
    }
    core._guardarEstado();
  },

  /**
   * Calcula similitud simple entre dos palabras (Jaccard)
   */
  _similitud(a, b) {
    const setA = new Set(a.toLowerCase().split(''));
    const setB = new Set(b.toLowerCase().split(''));
    const interseccion = new Set([...setA].filter(x => setB.has(x)));
    const union = new Set([...setA, ...setB]);
    return interseccion.size / union.size;
  },

  /**
   * Estado del módulo
   */
  obtenerEstado() {
    return { activo: this.activo };
  }
};

      this.estado.ultimoSueño = new Date().toISOString();
      this.actualizarPanel();
      // Disparar evento para que otros módulos lo sepan
      document.dispatchEvent(new CustomEvent('franbot-sueño'));
      return true;
    }
    return false;
  }
};

// Auto-inicializar cuando el DOM esté listo
document.addEventListener('DOMContentLoaded', () => FranBotConciencia.inicializar());

// ==================== FRANBOT UI CONTROLLER v5.0 ====================
(function(){
  'use strict';
  
  if (!window.franbot) { console.error('❌ FranBotCore no encontrado.'); return; }
  if (!window.franbotOnline) console.warn('⚠️ FranBotOnline no encontrado.');
  if (!window.SuperLocalMemory) console.warn('⚠️ SuperLocalMemory no encontrada.');
  
  const chat = document.getElementById('chat');
  const entrada = document.getElementById('input');
  const core = window.franbot;
  const online = window.franbotOnline;
  let modoOnline = false;

  function mostrar(txt, rol) {
    const d = document.createElement('div');
    d.className = 'bubble ' + (rol === 'user' ? 'user' : 'fran');
    d.innerHTML = txt.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
  }

  window.enviarMensaje = async function() {
    const txt = entrada.value.trim();
    if(!txt) return;
    mostrar(txt, 'user');
    entrada.value = '';
    let resp = null;
    if(modoOnline && online && online.disponible && online.apiKey) {
      try { resp = await online.preguntar(txt); } catch(e) {}
    }
    if(!resp) resp = core.procesar(txt);
    mostrar(resp, 'fran');
  };

  // Eventos de entrada
  document.getElementById('send').addEventListener('click', enviarMensaje);
  entrada.addEventListener('keypress', function(e) {
    if(e.key === 'Enter') enviarMensaje();
  });

  // Menú de herramientas
  document.getElementById('tools-btn').addEventListener('click', function(e) {
    e.stopPropagation();
    const menu = document.getElementById('tools-menu');
    menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
  });
  document.addEventListener('click', function() {
    document.getElementById('tools-menu').style.display = 'none';
  });

  // Botones del menú
  document.getElementById('btn-sonar-menu').addEventListener('click', function() {
    core.soñar();
    mostrar('🌙 He soñado. Campo consolidado.', 'fran');
    document.getElementById('tools-menu').style.display = 'none';
  });

  document.getElementById('btn-exportar-chat-menu').addEventListener('click', function() {
    const b = new Blob([chat.innerText],{type:'text/plain'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'franbot_chat.txt';
    a.click();
    document.getElementById('tools-menu').style.display = 'none';
  });

  document.getElementById('btn-exportar-menu').addEventListener('click', function() {
    const estado = JSON.stringify(core.estado, null, 2);
    const b = new Blob([estado],{type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = 'franbot_alma.json';
    a.click();
    document.getElementById('tools-menu').style.display = 'none';
  });

  // ------- Carga segura de almas (IMPORTAR) -------
  document.getElementById('btn-cargar-menu').addEventListener('click', function() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = function(e) {
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = function(ev) {
        try {
          const datos = JSON.parse(ev.target.result);
          if (window.importarAlmaSegura) {
            // Usa el módulo de importación robusta
            const resultado = window.importarAlmaSegura(datos);
            mostrar(resultado.mensaje, 'fran');
          } else {
            // Fallback básico si el módulo no está disponible
            core.estado = datos;
            core._guardarEstado();
            mostrar('📥 Alma cargada (modo básico).', 'fran');
          }
        } catch(ex) {
          mostrar('❌ Archivo no válido.', 'fran');
        }
      };
      reader.onerror = function() {
        mostrar('❌ Error al leer el archivo.', 'fran');
      };
      reader.readAsText(file);
    };
    input.click();
    document.getElementById('tools-menu').style.display = 'none';
  });

  document.getElementById('btn-adjuntar-menu').addEventListener('click', function() {
    document.getElementById('file-input').click();
    document.getElementById('tools-menu').style.display = 'none';
  });

  // Modo online / offline / webllm (rotativo)
  document.getElementById('toggle-mode-menu').addEventListener('click', async function() {
    if(!modoOnline) {
      if(!online) { mostrar('❌ Módulo online no disponible.', 'fran'); return; }
      const conectado = await online.probarConexion();
      if(!conectado) { mostrar('❌ Sin conexión.', 'fran'); return; }
      if(!online.apiKey) {
        const key = prompt('Clave API (Gemini u OpenAI):');
        if(!key) return;
        const prov = confirm('¿Usar Gemini? (Cancelar = OpenAI)') ? 'gemini' : 'openai';
        online.configurar(prov, key);
      }
      modoOnline = true;
      mostrar('🌐 Modo Online activado.', 'fran');
    } else {
      modoOnline = false;
      mostrar('🔒 Modo Offline.', 'fran');
    }
    document.getElementById('tools-menu').style.display = 'none';
  });
// ==================== COLMENA P2P ====================
document.getElementById('btn-colmena').addEventListener('click', function() {
  document.getElementById('tools-menu').style.display = 'none';
  const panel = document.getElementById('colmena-panel');
  if (panel) {
    panel.style.display = 'block';
    if (typeof FranBotColmena !== 'undefined') {
      if (!FranBotColmena.peer || !FranBotColmena.peer.id) {
        FranBotColmena.inicializar();
      }
      FranBotColmena.mostrarEstado(FranBotColmena.peer ? 'Reconectando...' : 'Iniciando...');
    } else {
      panel.querySelector('#colmena-status').textContent = '⚠️ Módulo Colmena no disponible.';
    }
  }
});

// ==================== ARWEAVE ====================
document.getElementById('btn-arweave-subir-menu').addEventListener('click', async function() {
  document.getElementById('tools-menu').style.display = 'none';
  if (typeof FranBotArweave === 'undefined') {
    mostrar('❌ Módulo Arweave no disponible.', 'fran');
    return;
  }
  const walletInput = document.createElement('input');
  walletInput.type = 'file';
  walletInput.accept = '.json';
  walletInput.onchange = async function(e) {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const wallet = JSON.parse(await file.text());
      const bytes = new TextEncoder().encode(JSON.stringify(core.estado)).length;
      const costo = await FranBotArweave.estimarCosto(bytes);
      const confirmar = confirm(`Subir alma a Arweave.\nTamaño: ${bytes} bytes\nCosto aprox: ${costo.costoAR} AR (~$${costo.costoUSD} USD).\n¿Continuar?`);
      if (!confirmar) return;
      mostrar('☁️ Subiendo alma a Arweave...', 'fran');
      const resultado = await FranBotArweave.subirAlma(core.estado, wallet);
      if (resultado.exito) {
        mostrar(`✅ Alma guardada en Arweave.\nID: ${resultado.txId}`, 'fran');
        core.estado.arweaveTxId = resultado.txId;
        core._guardarEstado();
      } else {
        mostrar(`❌ Error al subir: ${resultado.error}`, 'fran');
      }
    } catch (ex) {
      mostrar('❌ Error al leer la wallet.', 'fran');
    }
  };
  walletInput.click();
});

document.getElementById('btn-arweave-cargar-menu').addEventListener('click', async function() {
  document.getElementById('tools-menu').style.display = 'none';
  if (typeof FranBotArweave === 'undefined') {
    mostrar('❌ Módulo Arweave no disponible.', 'fran');
    return;
  }
  const txId = prompt('ID de transacción en Arweave:');
  if (!txId) return;
  mostrar('📥 Descargando alma desde Arweave...', 'fran');
  const resultado = await FranBotArweave.descargarAlma(txId);
  if (resultado.exito) {
    core.estado = resultado.estado;
    core._guardarEstado();
    mostrar('✅ Alma restaurada desde Arweave.', 'fran');
  } else {
    mostrar(`❌ Error al descargar: ${resultado.error}`, 'fran');
  }
});

const actualizarMPC = () => {
  const mpcElem = document.getElementById('mpc-display');

    mpcElem.textContent = 'MPC: ' + (core.estado.indicadores.nivel_coherencia?.toFixed(2) || '0.99');

};

core.soñar = function() {

};
actualizarMPC(); // inicializar
// Mensaje de bienvenida
  const nombre = core.estado.modelo_usuario?.nombre || 'Usuario';

  mostrar('🧬 **Bienvenido/a, ' + nombre + '.**<br>Soy FranBot v5.0. MPC: ' + mpc, 'fran');
