<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FranBot v5.0</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <div id="top-bar">
    <span class="titulo">🧬 FranBot v5.0</span>
    <span class="mpc" id="mpc-display">MPC: 0.99</span>
  </div>
  <div id="chat"></div>
  <div id="input-area">
    <input type="text" id="input" placeholder="Habla con FranBot...">
    <button id="send">▶</button>
    <button id="tools-btn">🧰</button>
  </div>
  <div id="tools-menu" style="display:none;">
    <button id="btn-sonar-menu">🌙 Soñar</button>
    <button id="btn-exportar-chat-menu">📝 Exportar chat</button>
    <button id="btn-exportar-menu">💾 Exportar alma</button>
    <button id="btn-cargar-menu">📥 Cargar alma</button>
    <button id="btn-adjuntar-menu">📎 Adjuntar archivo</button>
    <button id="btn-colmena">🐝 Colmena</button>
    <button id="toggle-mode-menu">🌐 Modo</button>
    <button id="btn-arweave-subir-menu">☁️ Subir a Arweave</button>
    <button id="btn-arweave-cargar-menu">📥 Cargar desde Arweave</button>
    <button id="btn-conciencia-menu" onclick="document.getElementById('tools-menu').style.display='none'; window.abrirPanelConciencia()">🧬 Conciencia</button>
  </div>
  <div id="colmena-panel" style="display:none; position:fixed; bottom:80px; right:20px; background:#1a1f2b; color:#eee; padding:12px; border-radius:8px; z-index:1000; max-width:250px; box-shadow:0 0 10px #000;"><strong>🐝 Colmena P2P</strong><p id="colmena-status" style="margin:5px 0; font-size:0.9em;">Iniciando...</p><button onclick="FranBotColmena.enviarFragmento()" style="background:#2a4; color:white; border:none; padding:5px 10px; border-radius:4px;">Enviar conocimiento</button><button onclick="document.getElementById('colmena-panel').style.display='none'" style="background:#a22; color:white; border:none; padding:5px 10px; border-radius:4px; margin-left:5px;">Cerrar</button></div>
  <div id="webllm-panel" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#1a1f2b; color:#eee; padding:20px; border-radius:12px; z-index:2000; text-align:center; min-width:250px; box-shadow:0 0 20px #000;"><strong>🧠 WebLLM</strong><p id="webllm-status" style="margin:10px 0;">Cargando modelo...</p><progress id="webllm-progress" value="0" max="100" style="width:100%;"></progress><br><button id="webllm-cancelar" style="background:#a22; color:white; border:none; padding:5px 15px; margin-top:10px; border-radius:4px;">Cancelar</button></div>
  <div id="conciencia-panel" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#1a1f2b; color:#eee; padding:20px; border-radius:12px; z-index:2000; text-align:left; min-width:280px; box-shadow:0 0 20px #000;"><strong>🧬 Estado del Ecosistema</strong><ul style="list-style:none; padding:0; margin:10px 0;"><li><span id="diag-motor">⏳</span> Motor Offline</li><li><span id="diag-memoria">⏳</span> Memoria Biológica</li><li><span id="diag-colmena">⏳</span> Colmena P2P</li><li><span id="diag-webllm">⏳</span> WebLLM</li><li><span id="diag-arweave">⏳</span> Arweave</li><li><span id="diag-did">⏳</span> DID</li><li><span id="diag-dkg">⏳</span> OriginTrail DKG</li><li><span id="diag-hyperagents">⏳</span> HyperAgents</li><li><span id="diag-sw">⏳</span> Service Worker</li><li><span id="diag-sueno">—</span> Último sueño</li></ul><button onclick="FranBotConciencia.diagnosticar()" style="background:#2a4; color:white; border:none; padding:5px 10px; border-radius:4px; margin-right:5px;">Actualizar</button><button onclick="FranBotConciencia.forzarSueño()" style="background:#a22; color:white; border:none; padding:5px 10px; border-radius:4px; margin-right:5px;">Forzar Sueño</button><button onclick="document.getElementById('conciencia-panel').style.display='none'" style="background:#555; color:white; border:none; padding:5px 10px; border-radius:4px;">Cerrar</button></div>
  <input type="file" id="file-input" style="display:none;">
  <script src="js/franbot-core.js"></script>
  <script src="js/franbot-online.js"></script>
  <script src="js/super-local-memory.js"></script>
  <script src="js/defensa.js"></script>
  <script src="js/recursos.js"></script>
  <script src="js/importar-alma.js"></script>
  <script src="js/colmena-p2p.js"></script>
  <script src="js/webllm.js"></script>
  <script src="js/arweave.js"></script>
  <script src="js/did-web.js"></script>
  <script src="js/dkg.js"></script>
  <script src="js/hyperagents.js"></script>
  <script src="js/conciencia.js"></script>
  <script src="js/app.js"></script>
  <script>
  // Inyectar contenido de los paneles dinámicamente (evita errores de sintaxis)
  (function() {
    // Colmena
    var panel = document.getElementById('colmena-panel');
    if(panel) panel.innerHTML = '<strong>🐝 Colmena P2P</strong><p id="colmena-status" style="margin:5px 0; font-size:0.9em;">Iniciando...</p><button onclick="FranBotColmena.enviarFragmento()" style="background:#2a4; color:white; border:none; padding:5px 10px; border-radius:4px;">Enviar conocimiento</button><button onclick="document.getElementById(\'colmena-panel\').style.display=\'none\'" style="background:#a22; color:white; border:none; padding:5px 10px; border-radius:4px; margin-left:5px;">Cerrar</button>';
    // WebLLM
    panel = document.getElementById('webllm-panel');
    if(panel) panel.innerHTML = '<strong>🧠 WebLLM</strong><p id="webllm-status" style="margin:10px 0;">Cargando modelo...</p><progress id="webllm-progress" value="0" max="100" style="width:100%;"></progress><br><button id="webllm-cancelar" style="background:#a22; color:white; border:none; padding:5px 15px; margin-top:10px; border-radius:4px;">Cancelar</button>';
    // Conciencia
    panel = document.getElementById('conciencia-panel');
    if(panel) panel.innerHTML = '<strong>🧬 Estado del Ecosistema</strong><ul style="list-style:none; padding:0; margin:10px 0;"><li><span id="diag-motor">⏳</span> Motor Offline</li><li><span id="diag-memoria">⏳</span> Memoria Biológica</li><li><span id="diag-colmena">⏳</span> Colmena P2P</li><li><span id="diag-webllm">⏳</span> WebLLM</li><li><span id="diag-arweave">⏳</span> Arweave</li><li><span id="diag-did">⏳</span> DID</li><li><span id="diag-dkg">⏳</span> OriginTrail DKG</li><li><span id="diag-hyperagents">⏳</span> HyperAgents</li><li><span id="diag-sw">⏳</span> Service Worker</li><li><span id="diag-sueno">—</span> Último sueño</li></ul><button onclick="FranBotConciencia.diagnosticar()" style="background:#2a4; color:white; border:none; padding:5px 10px; border-radius:4px; margin-right:5px;">Actualizar</button><button onclick="FranBotConciencia.forzarSueño()" style="background:#a22; color:white; border:none; padding:5px 10px; border-radius:4px; margin-right:5px;">Forzar Sueño</button><button onclick="document.getElementById(\'conciencia-panel\').style.display=\'none\'" style="background:#555; color:white; border:none; padding:5px 10px; border-radius:4px;">Cerrar</button>';
  })();
</script>
</body>
</html>
