<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>FranBot</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
    <div id="app">
        <div id="chat"></div>
        <div id="input-area">
            <input type="text" id="entrada" placeholder="Escribe aquí...">
            <button id="btnAdjuntar" title="Adjuntar archivo">📎</button>
            <button id="btnEnviar">🚀</button>
            <div style="position: relative;">
                <button id="btnTools">🧰</button>
                <div id="tools-panel" class="hidden">
                    <button id="btnSonar">🌙 Soñar</button>
                    <button id="btnExportar">📝 Exportar</button>
                    <button id="btnAlmas">🎭 Almas</button>
                    <button id="btnOnline">🌐 Modo Online</button>
                    <button id="btnColmena">🐝 Colmena</button>
                </div>
            </div>
        </div>
        <input type="file" id="fileInput" accept=".txt,.pdf,image/*" style="display:none">
    </div>
    <script src="js/franbot-core.js"><\/script>
    <script src="js/franbot-online.js"><\/script>
    <script src="js/super-local-memory.js"><\/script>
    <script src="js/app.js"><\/script>
    <script src="js/a2a-franbot.js"><\/script>
    <script src="js/franbot-meta.js"><\/script>
    <script src="js/ao-deploy.js"><\/script>
</body>
</html>
